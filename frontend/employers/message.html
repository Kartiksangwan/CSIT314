<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Employer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../api.js"></script>
</head>
<body class="bg-[#f2f2f2] p-4 font-sans text-black">
  <div class="w-[700px] mx-auto bg-[#f7fbff]">
    <nav class="h-[65px] bg-white border border-[#79c5ff] flex items-end px-4">
      <svg width="95" height="45" viewBox="0 0 120 55"><path d="M25 37 C35 22, 24 15, 17 22 C10 29, 16 40, 30 38 C42 36, 48 23, 58 19" fill="none" stroke="#0059d9" stroke-width="9" stroke-linecap="round"/><path d="M54 34 C72 30, 82 17, 84 5 C75 18, 62 14, 59 28 Z" fill="#18a9f5"/><circle cx="24" cy="14" r="8" fill="#0059d9"/></svg>
      <div class="ml-auto flex">
        <button onclick="window.location.href='applicant.html'" class="w-[108px] h-[32px] bg-white border border-[#79c5ff] border-b-0 rounded-t text-base ml-4">Applicant</button>
        <button onclick="window.location.href='searchfrom.html'" class="w-[108px] h-[32px] bg-white border border-[#79c5ff] border-b-0 rounded-t text-base ml-4">Search</button>
        <button class="w-[108px] h-[32px] bg-white border border-[#79c5ff] border-b-0 rounded-t text-base ml-4 font-bold text-blue-600">Message</button>
      </div>
    </nav>

    <div class="grid grid-cols-[220px_1fr] min-h-[500px] border-t border-gray-300">
      <div id="conv-list" class="border-r border-[#79c5ff] pt-3 pr-2 space-y-2 overflow-y-auto">
        <div class="text-gray-400 text-xs p-3">Loading...</div>
      </div>

      <div class="pt-4 pl-4 pr-4 flex flex-col">
        <h2 id="chat-title" class="text-base font-bold mb-4">Select a conversation</h2>
        <div id="chat-body" class="border border-[#79c5ff] p-4 bg-white min-h-[280px] flex-1 overflow-y-auto space-y-2 text-sm"></div>
        <div class="mt-3 flex gap-2">
          <input type="text" id="msg-input" placeholder="Type a message..." class="flex-1 border border-gray-300 px-3 py-1 text-sm focus:outline-none">
          <button onclick="sendMsg()" class="bg-[#b2ebf2] border border-gray-400 px-4 py-1 font-bold text-sm hover:bg-[#99d9e0]">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentPartnerId = null;
    let myUserId = null;

    async function loadConversations() {
      if (!requireLogin('employer')) return;
      const me = getSession();
      myUserId = me.id;

      const res = await getMessages();
      const list = document.getElementById('conv-list');

      if (!res.conversations || res.conversations.length === 0) {
        list.innerHTML = '<div class="text-gray-400 text-xs p-3">No messages yet.</div>';
        return;
      }

      list.innerHTML = res.conversations.map(conv => `
        <div onclick="openThread(${conv.partner_id}, '${conv.partner_email}')"
          class="p-2 border border-transparent hover:bg-gray-50 cursor-pointer">
          <div class="flex items-center space-x-2">
            <div class="w-5 h-5 rounded-full bg-gray-300 flex-shrink-0"></div>
            <span class="font-bold text-xs">${conv.partner_email}</span>
          </div>
          <div class="text-[10px] text-gray-600 mt-1 pl-7 truncate">${conv.latest ? conv.latest.content : ''}</div>
        </div>
      `).join('');
    }

    async function openThread(partnerId, partnerEmail) {
      currentPartnerId = partnerId;
      document.getElementById('chat-title').textContent = partnerEmail;
      const body = document.getElementById('chat-body');
      body.innerHTML = '<div class="text-gray-400 text-xs">Loading...</div>';

      const res = await getThread(partnerId);
      if (!res.messages || res.messages.length === 0) {
        body.innerHTML = '<div class="text-gray-400 text-xs">No messages yet.</div>';
        return;
      }

      body.innerHTML = res.messages.map(m => {
        const mine = m.sender_user_id === myUserId;
        return `<div class="${mine ? 'text-right' : 'text-left'}">
          <span class="inline-block px-3 py-1.5 rounded ${mine ? 'bg-blue-100' : 'bg-gray-100'} text-xs max-w-[80%]">${m.content}</span>
          <div class="text-[9px] text-gray-400 mt-0.5">${m.sent_at.substring(0,16)}</div>
        </div>`;
      }).join('');
      body.scrollTop = body.scrollHeight;
    }

    async function sendMsg() {
      if (!currentPartnerId) { alert('Select a conversation first'); return; }
      const input = document.getElementById('msg-input');
      const content = input.value.trim();
      if (!content) return;
      input.value = '';
      const res = await sendMessage(currentPartnerId, content);
      if (res.error) { alert(res.error); return; }
      openThread(currentPartnerId, document.getElementById('chat-title').textContent);
    }

    document.getElementById('msg-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMsg();
    });

    loadConversations();
  </script>
</body>
</html>
