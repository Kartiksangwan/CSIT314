<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applicants</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../api.js"></script>
</head>
<body class="bg-[#f2f2f2] p-3 font-sans text-black">
  <div class="w-[630px] mx-auto bg-[#f7fbff]">
    <nav class="h-[58px] bg-white border border-[#79c5ff] flex items-end px-4">
      <svg width="90" height="42" viewBox="0 0 120 55"><path d="M25 37 C35 22, 24 15, 17 22 C10 29, 16 40, 30 38 C42 36, 48 23, 58 19" fill="none" stroke="#0059d9" stroke-width="9" stroke-linecap="round"/><path d="M54 34 C72 30, 82 17, 84 5 C75 18, 62 14, 59 28 Z" fill="#18a9f5"/><circle cx="24" cy="14" r="8" fill="#0059d9"/></svg>
      <div class="ml-auto flex">
        <button class="w-[96px] h-[29px] bg-white border border-[#79c5ff] border-b-0 rounded-t text-base ml-4 font-bold text-blue-600">Applicant</button>
        <button onclick="window.location.href='searchfrom.html'" class="w-[96px] h-[29px] bg-white border border-[#79c5ff] border-b-0 rounded-t text-base ml-4">Search</button>
        <button onclick="window.location.href='message.html'" class="w-[96px] h-[29px] bg-white border border-[#79c5ff] border-b-0 rounded-t text-base ml-4">Message</button>
      </div>
    </nav>

    <section class="p-5">
      <div class="font-bold text-base ml-14 mb-6">Applicants</div>
      <div id="applicant-list" class="space-y-10">
        <div class="text-gray-400 text-sm text-center py-6">Loading...</div>
      </div>
    </section>
  </div>

  <!-- Message modal -->
  <div id="msg-modal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-xl p-6 w-[380px]">
      <h3 class="font-bold text-base mb-1">Send Message</h3>
      <p id="msg-to" class="text-xs text-gray-500 mb-3"></p>
      <textarea id="msg-body" rows="4" placeholder="Type your message..." class="w-full border border-gray-300 rounded p-2 text-sm resize-none focus:outline-none focus:border-blue-400"></textarea>
      <div class="flex justify-end gap-2 mt-3">
        <button onclick="closeModal()" class="px-4 py-1.5 text-sm border border-gray-300 rounded hover:bg-gray-50">Cancel</button>
        <button onclick="doSendMessage()" class="px-4 py-1.5 text-sm bg-[#b2ebf2] border border-gray-400 rounded font-bold hover:bg-[#99d9e0]">Send</button>
      </div>
    </div>
  </div>

  <script>
    let currentReceiverUserId = null;

    async function loadApplicants() {
      if (!requireLogin('employer')) return;
      const res = await getApplicants();
      const list = document.getElementById('applicant-list');

      if (!res.applicants || res.applicants.length === 0) {
        list.innerHTML = '<div class="text-gray-400 text-sm text-center py-6">No applicants yet.</div>';
        return;
      }

      list.innerHTML = res.applicants.map(item => {
        const c = item.candidate;
        const app = item.application;
        return `
          <div class="grid grid-cols-[135px_85px_220px_65px] gap-3 items-center">
            <div class="text-base text-center leading-tight">
              Match: ${app.match_score}%<br>
              <span class="text-sm text-gray-600">${app.matched_keywords ? app.matched_keywords.split(',').map(k => '#' + k.trim()).join(' ') : ''}</span>
            </div>
            <div class="w-[80px] h-[72px] bg-[#d9d9d9] relative">
              <svg class="absolute inset-0 w-full h-full stroke-gray-600 stroke-[0.8]" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><line x1="0" y1="0" x2="100%" y2="100%"/><line x1="100%" y1="0" x2="0" y2="100%"/></svg>
            </div>
            <div class="border border-[#79c5ff] bg-white min-h-[98px] p-2 text-xs leading-tight">
              <strong class="text-sm">${c ? c.full_name : 'Unknown'}</strong><br>
              ${c ? c.job_title || '' : ''}<br>
              ${c ? c.skills || '' : ''}<br>
              ${c ? (c.experience_years || '') + ' experience' : ''}<br>
              ${c ? c.location || '' : ''}
            </div>
            <div class="flex flex-col gap-2">
              <button onclick="submitOffer(${c ? c.id : 0}, ${app.job_id})" class="text-xs bg-[#b2ebf2] border border-gray-400 px-2 py-1 font-bold hover:bg-[#99d9e0]">Offer</button>
              <button onclick="openModal(${c ? c.user_id : 0}, '${c ? c.full_name : 'Candidate'}')" class="text-xs bg-white border border-[#79c5ff] px-2 py-1 font-bold hover:bg-blue-50">Message</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(userIdOfCandidate, name) {
      currentReceiverUserId = userIdOfCandidate;
      document.getElementById('msg-to').textContent = 'To: ' + name;
      document.getElementById('msg-body').value = '';
      document.getElementById('msg-modal').classList.remove('hidden');
      document.getElementById('msg-body').focus();
    }

    function closeModal() {
      document.getElementById('msg-modal').classList.add('hidden');
      currentReceiverUserId = null;
    }

    async function doSendMessage() {
      const content = document.getElementById('msg-body').value.trim();
      if (!content) { alert('Please type a message.'); return; }
      const res = await sendMessage(currentReceiverUserId, content);
      if (res.error) { alert(res.error); return; }
      closeModal();
      // redirect to message page so they can continue the thread
      window.location.href = 'message.html';
    }

    async function submitOffer(candidateId, jobId) {
      const date = prompt('Interview date (e.g. Sep 10):');
      const time = prompt('Interview time (e.g. 10:00 AM):');
      const msg = prompt('Message to candidate:') || '';
      if (!date) return;
      const res = await sendOffer({ candidate_id: candidateId, job_id: jobId, interview_date: date, interview_time: time, message: msg });
      if (res.error) alert(res.error);
      else alert('Offer sent!');
    }

    loadApplicants();
  </script>
</body>
</html>
