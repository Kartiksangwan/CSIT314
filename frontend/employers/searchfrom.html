<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Candidates</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../api.js"></script>
</head>
<body class="bg-[#f2f2f2] p-5 font-sans text-black">
  <div class="w-[700px] mx-auto bg-[#f7fbff]">
    <nav class="h-[60px] bg-white border border-[#7cc9ff] flex items-end px-5">
      <svg width="95" height="45" viewBox="0 0 120 55"><path d="M25 37 C35 22, 24 15, 17 22 C10 29, 16 40, 30 38 C42 36, 48 23, 58 19" fill="none" stroke="#0059d9" stroke-width="9" stroke-linecap="round"/><path d="M54 34 C72 30, 82 17, 84 5 C75 18, 62 14, 59 28 Z" fill="#18a9f5"/><circle cx="24" cy="14" r="8" fill="#0059d9"/></svg>
      <button onclick="window.location.href='applicant.html'" class="w-[100px] h-[32px] border border-[#7cc9ff] bg-white rounded-t ml-4">Applicant</button>
      <button class="w-[100px] h-[32px] border border-[#7cc9ff] bg-white rounded-t ml-4 font-bold text-blue-600">Search</button>
      <button onclick="window.location.href='message.html'" class="w-[100px] h-[32px] border border-[#7cc9ff] bg-white rounded-t ml-4">Message</button>
    </nav>

    <div class="p-8">
      <!-- Keyword + location + work mode -->
      <div class="flex flex-wrap gap-2 mb-3">
        <input type="text" id="kw" placeholder="Skill or keyword e.g. Python"
          class="flex-1 min-w-[160px] h-[32px] bg-[#b2ebf2] border-none px-3 text-sm font-bold placeholder-gray-700 focus:outline-none">
        <input type="text" id="loc" placeholder="Location e.g. Brisbane"
          class="w-[160px] h-[32px] bg-[#b2ebf2] border-none px-3 text-sm font-bold placeholder-gray-700 focus:outline-none">
        <select id="wm" class="w-[130px] h-[32px] bg-[#b2ebf2] border-none px-2 text-sm font-bold focus:outline-none">
          <option value="">Work Mode</option>
          <option value="Remote">Remote</option>
          <option value="Hybrid">Hybrid</option>
          <option value="On-site">On-site</option>
        </select>
        <button onclick="doSearch()" class="px-4 h-[32px] bg-[#b2ebf2] font-bold text-sm border border-gray-400 hover:bg-[#99d9e0]">🔍 Search</button>
      </div>

      <!-- Clear -->
      <div class="mb-6">
        <button onclick="clearFilters()" class="text-xs text-gray-400 hover:text-red-500 underline">Clear filters</button>
      </div>

      <div id="result-list" class="space-y-6">
        <div class="text-gray-400 text-sm text-center py-6">Search for candidates by skill e.g. "JavaScript", "Python"</div>
      </div>
    </div>
  </div>

  <!-- Message modal -->
  <div id="msg-modal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg shadow-xl p-6 w-[380px]">
      <h3 class="font-bold text-base mb-1">Send Message</h3>
      <p id="msg-to" class="text-xs text-gray-500 mb-3"></p>
      <textarea id="msg-body" rows="4" placeholder="Type your message..." class="w-full border border-gray-300 rounded p-2 text-sm resize-none focus:outline-none focus:border-blue-400"></textarea>
      <div class="flex justify-end gap-2 mt-3">
        <button onclick="closeModal()" class="px-4 py-1.5 text-sm border border-gray-300 rounded hover:bg-gray-50">Cancel</button>
        <button onclick="doSendMessage()" class="px-4 py-1.5 text-sm bg-[#b2ebf2] border border-gray-400 rounded font-bold hover:bg-[#99d9e0]">Send</button>
      </div>
    </div>
  </div>

  <script>
    let currentReceiverUserId = null;

    function clearFilters() {
      document.getElementById('kw').value = '';
      document.getElementById('loc').value = '';
      document.getElementById('wm').value = '';
      document.getElementById('result-list').innerHTML = '<div class="text-gray-400 text-sm text-center py-6">Search cleared.</div>';
    }

    async function doSearch() {
      if (!requireLogin('employer')) return;
      const kw  = document.getElementById('kw').value;
      const loc = document.getElementById('loc').value;
      const wm  = document.getElementById('wm').value;
      const list = document.getElementById('result-list');
      list.innerHTML = '<div class="text-gray-400 text-sm text-center py-6">Searching...</div>';

      // build URL manually to pass location + work_mode
      let url = '/search/candidates?';
      if (kw)  url += 'keyword=' + encodeURIComponent(kw) + '&';
      if (loc) url += 'location=' + encodeURIComponent(loc) + '&';
      if (wm)  url += 'work_mode=' + encodeURIComponent(wm);

      const res = await apiGet(url);

      if (!res.candidates || res.candidates.length === 0) {
        list.innerHTML = '<div class="text-gray-400 text-sm text-center py-6">No candidates found. Try different keywords or broaden your filters.</div>';
        return;
      }

      list.innerHTML = res.candidates.map(c => `
        <div class="border border-[#79c5ff] bg-white p-4 flex justify-between items-start">
          <div class="text-sm leading-relaxed flex-1 pr-4">
            <div class="font-bold text-base">${c.full_name || 'Unknown'}</div>
            <div class="text-gray-700">${c.job_title || ''}</div>
            <div class="text-gray-600 text-xs mt-1">Skills: ${c.skills || ''}</div>
            <div class="text-gray-600 text-xs">📍 ${c.location || ''} &nbsp; 💼 ${c.work_mode || ''}</div>
            <div class="text-gray-600 text-xs">🎓 ${c.education || ''} &nbsp; ⏱ ${c.experience_years || ''}</div>
            ${c.match_score ? `<div class="text-blue-600 font-bold text-xs mt-1">Match: ${c.match_score}%</div>` : ''}
            ${c.matched_keywords && c.matched_keywords.length ? `<div class="text-xs text-gray-400">${c.matched_keywords.map(k => '#'+k).join(' ')}</div>` : ''}
          </div>
          <button onclick="openModal(${c.user_id}, '${c.full_name || 'Candidate'}')"
            class="flex-shrink-0 text-xs bg-[#b2ebf2] border border-gray-400 px-3 py-1.5 font-bold rounded hover:bg-[#99d9e0]">
            💬 Message
          </button>
        </div>
      `).join('');
    }

    function openModal(userIdOfCandidate, name) {
      currentReceiverUserId = userIdOfCandidate;
      document.getElementById('msg-to').textContent = 'To: ' + name;
      document.getElementById('msg-body').value = '';
      document.getElementById('msg-modal').classList.remove('hidden');
      document.getElementById('msg-body').focus();
    }

    function closeModal() {
      document.getElementById('msg-modal').classList.add('hidden');
      currentReceiverUserId = null;
    }

    async function doSendMessage() {
      const content = document.getElementById('msg-body').value.trim();
      if (!content) { alert('Please type a message.'); return; }
      const res = await sendMessage(currentReceiverUserId, content);
      if (res.error) { alert(res.error); return; }
      closeModal();
      window.location.href = 'message.html';
    }

    document.getElementById('kw').addEventListener('keypress', e => { if (e.key === 'Enter') doSearch(); });
    document.getElementById('loc').addEventListener('keypress', e => { if (e.key === 'Enter') doSearch(); });
  </script>
</body>
</html>
