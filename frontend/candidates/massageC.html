<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../api.js"></script>
</head>
<body class="bg-white min-h-screen font-sans p-6 text-black">
  <div class="max-w-[850px] mx-auto border border-gray-200 p-8 shadow-sm">
    <h1 class="text-3xl font-medium text-gray-400 mb-4">Message <span class="text-2xl">★</span></h1>
    <header class="border border-blue-200 p-3 mb-6 flex items-center justify-between">
      <svg width="120" height="45" viewBox="0 0 120 45" fill="none"><path d="M15 35C20 30 25 15 10 15C5 15 2 25 12 30C22 35 30 20 35 15" stroke="#1e62d0" stroke-width="4" stroke-linecap="round"/><path d="M42 32C35 25 35 12 48 15C55 17 50 30 42 32Z" fill="#50a5f5"/><path d="M38 15C43 20 52 25 58 12" stroke="#1e62d0" stroke-width="3" stroke-linecap="round"/></svg>
      <div class="flex -space-x-px mr-4">
        <button onclick="window.location.href='offerpageC.html'" class="px-8 py-2 font-bold border border-gray-300 rounded-t-md text-lg bg-white">Offer</button>
        <button onclick="window.location.href='bookmarkC.html'" class="px-8 py-2 font-bold border border-gray-300 rounded-t-md text-lg bg-white">Bookmark</button>
        <button class="px-8 py-2 font-bold border border-gray-400 rounded-t-md text-lg bg-gray-100 text-blue-600">Message</button>
      </div>
      <button onclick="window.location.href='mypageC.html'" class="pr-2 text-sm text-blue-600 font-bold">My Page</button>
    </header>

    <div class="grid grid-cols-12 border-t border-gray-300 min-h-[500px]">
      <div id="conv-list" class="col-span-4 border-r border-blue-200 pt-3 pr-2 space-y-2 overflow-y-auto">
        <div class="text-gray-400 text-sm p-3">Loading...</div>
      </div>

      <div class="col-span-8 pt-4 pl-6 pr-4 flex flex-col">
        <div class="flex items-center space-x-3 mb-4">
          <div class="w-7 h-7 rounded-full bg-gray-300"></div>
          <h2 id="chat-title" class="text-xl font-bold">Select a conversation</h2>
        </div>
        <div id="chat-body" class="border border-blue-300 p-4 bg-white min-h-[250px] flex-1 overflow-y-auto space-y-3 text-[14px]"></div>
        <div class="mt-3 flex gap-2">
          <input type="text" id="msg-input" placeholder="Type a message..." class="flex-1 border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-blue-400">
          <button onclick="sendMsg()" class="bg-[#b2dfdb] border border-gray-400 px-4 py-2 font-bold text-sm hover:bg-[#99ceca]">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentPartnerId = null;
    let myUserId = null;

    async function loadConversations() {
      if (!requireLogin('candidate')) return;
      const me = getSession();
      myUserId = me.id;

      const res = await getMessages();
      const list = document.getElementById('conv-list');

      if (!res.conversations || res.conversations.length === 0) {
        list.innerHTML = '<div class="text-gray-400 text-sm p-3">No messages yet.</div>';
        return;
      }

      list.innerHTML = res.conversations.map(conv => `
        <div onclick="openThread(${conv.partner_id}, '${conv.partner_email}')"
          class="p-2 border border-transparent hover:bg-gray-50 cursor-pointer rounded">
          <div class="flex justify-between items-start">
            <div class="flex items-center space-x-2">
              <div class="w-6 h-6 rounded-full bg-gray-300 flex-shrink-0"></div>
              <span class="font-bold text-[13px]">${conv.partner_email}</span>
            </div>
          </div>
          <div class="text-[11px] text-gray-600 mt-1 pl-8 truncate">${conv.latest ? conv.latest.content : ''}</div>
        </div>
      `).join('');
    }

    async function openThread(partnerId, partnerEmail) {
      currentPartnerId = partnerId;
      document.getElementById('chat-title').textContent = partnerEmail;
      const body = document.getElementById('chat-body');
      body.innerHTML = '<div class="text-gray-400 text-xs">Loading...</div>';

      const res = await getThread(partnerId);
      if (!res.messages || res.messages.length === 0) {
        body.innerHTML = '<div class="text-gray-400 text-xs">No messages yet.</div>';
        return;
      }

      body.innerHTML = res.messages.map(m => {
        const mine = m.sender_user_id === myUserId;
        return `<div class="${mine ? 'text-right' : 'text-left'}">
          <span class="inline-block px-3 py-2 rounded ${mine ? 'bg-blue-100' : 'bg-gray-100'} text-[13px] max-w-[80%]">${m.content}</span>
          <div class="text-[10px] text-gray-400 mt-0.5">${m.sent_at.substring(0,16)}</div>
        </div>`;
      }).join('');

      body.scrollTop = body.scrollHeight;
    }

    async function sendMsg() {
      if (!currentPartnerId) { alert('Select a conversation first'); return; }
      const input = document.getElementById('msg-input');
      const content = input.value.trim();
      if (!content) return;
      input.value = '';
      const res = await sendMessage(currentPartnerId, content);
      if (res.error) { alert(res.error); return; }
      openThread(currentPartnerId, document.getElementById('chat-title').textContent);
    }

    document.getElementById('msg-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMsg();
    });

    loadConversations();
  </script>
</body>
</html>
