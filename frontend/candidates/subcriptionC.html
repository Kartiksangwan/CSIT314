<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../api.js"></script>
</head>
<body class="bg-white min-h-screen font-sans p-6 text-black">
  <div class="max-w-[850px] mx-auto border border-gray-200 p-8 shadow-sm min-h-[600px] flex flex-col justify-between">
    <div class="w-full">
      <h1 class="text-3xl font-medium text-gray-400 mb-4">Subscription page <span class="text-2xl">★</span></h1>

      <header class="border border-blue-200 p-3 mb-10 flex items-center justify-between">
        <svg width="120" height="45" viewBox="0 0 120 45" fill="none"><path d="M15 35C20 30 25 15 10 15C5 15 2 25 12 30C22 35 30 20 35 15" stroke="#1e62d0" stroke-width="4" stroke-linecap="round"/><path d="M42 32C35 25 35 12 48 15C55 17 50 30 42 32Z" fill="#50a5f5"/><path d="M38 15C43 20 52 25 58 12" stroke="#1e62d0" stroke-width="3" stroke-linecap="round"/></svg>
        <button onclick="window.location.href='mypageC.html'" class="pr-2 text-sm text-blue-600 font-bold">My Page</button>
      </header>

      <div id="current-plan" class="text-center text-sm text-gray-500 mb-6"></div>
      <div id="msg" class="text-center text-green-600 font-semibold text-sm mb-4 hidden"></div>

      <div class="grid grid-cols-2 max-w-[700px] mx-auto relative pt-4">
        <div class="absolute inset-y-0 left-1/2 w-px bg-gray-400 transform -translate-x-1/2"></div>

        <!-- Free Plan -->
        <div class="flex flex-col items-center pr-8 text-center space-y-6">
          <h2 class="text-xl font-bold">Free Plan</h2>
          <div class="text-xl font-bold py-2">$0</div>
          <button onclick="selectPlan('free')" id="btn-free" class="bg-[#b2dfdb] border border-gray-400 px-10 py-1.5 font-bold text-[15px] hover:bg-[#99ceca] transition">Select</button>
          <ul class="text-left font-semibold text-[15px] space-y-3 pt-4 pl-4">
            <li>✔ View recommended jobs</li>
            <li>✔ Apply to jobs</li>
            <li>✔ Save bookmarks</li>
            <li class="text-gray-400">✘ Limited to Top 10 recommendations</li>
          </ul>
        </div>

        <!-- Premium Plan -->
        <div class="flex flex-col items-center pl-8 text-center space-y-6">
          <h2 class="text-xl font-bold">Premium Plan</h2>
          <div class="text-xl font-bold py-2">$20<span class="text-[16px] font-normal">/month</span></div>
          <button onclick="selectPlan('premium')" id="btn-premium" class="bg-[#b2dfdb] border border-gray-400 px-6 py-1.5 font-bold text-[15px] hover:bg-[#99ceca] transition">Select Premium</button>
          <ul class="text-left font-semibold text-[15px] space-y-3 pt-4 pl-4">
            <li>✔ View recommended jobs</li>
            <li>✔ Apply to jobs</li>
            <li>✔ Save bookmarks</li>
            <li>✔ <span class="text-blue-700">Unlimited recommendations</span></li>
            <li>✔ Priority matching</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentSub = 'free';

    async function loadCurrentPlan() {
      if (!requireLogin('candidate')) return;
      const res = await getCandidateProfile();
      if (res.candidate) {
        currentSub = res.candidate.subscription || 'free';
        document.getElementById('current-plan').textContent = `Current plan: ${currentSub.charAt(0).toUpperCase() + currentSub.slice(1)}`;
        // highlight active plan button
        const activeBtn = document.getElementById('btn-' + currentSub);
        if (activeBtn) { activeBtn.textContent = '✓ Current Plan'; activeBtn.classList.add('bg-green-200'); }
      }
    }

    async function selectPlan(plan) {
      if (plan === currentSub) { alert('You are already on this plan.'); return; }
      const res = await updateSubscription(plan);
      const msg = document.getElementById('msg');
      if (res.error) { msg.textContent = res.error; msg.classList.remove('hidden'); msg.classList.add('text-red-600'); }
      else {
        msg.textContent = `Successfully switched to ${plan} plan!`;
        msg.classList.remove('hidden');
        currentSub = plan;
        // refresh button states
        ['free','basic','premium'].forEach(p => {
          const b = document.getElementById('btn-' + p);
          if (b) { b.classList.remove('bg-green-200'); b.textContent = p === 'premium' ? 'Select Premium' : 'Select'; }
        });
        const activeBtn = document.getElementById('btn-' + plan);
        if (activeBtn) { activeBtn.textContent = '✓ Current Plan'; activeBtn.classList.add('bg-green-200'); }
        document.getElementById('current-plan').textContent = `Current plan: ${plan.charAt(0).toUpperCase() + plan.slice(1)}`;
        setTimeout(() => msg.classList.add('hidden'), 3000);
      }
    }

    loadCurrentPlan();
  </script>
</body>
</html>
