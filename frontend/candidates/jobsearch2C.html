<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../api.js"></script>
</head>
<body class="bg-white min-h-screen font-sans p-6 text-black">
  <div class="max-w-[850px] mx-auto border border-gray-200 p-8 shadow-sm">
    <header class="border border-blue-200 p-3 mb-10 flex items-center justify-between">
      <svg width="120" height="45" viewBox="0 0 120 45" fill="none"><path d="M15 35C20 30 25 15 10 15C5 15 2 25 12 30C22 35 30 20 35 15" stroke="#1e62d0" stroke-width="4" stroke-linecap="round"/><path d="M42 32C35 25 35 12 48 15C55 17 50 30 42 32Z" fill="#50a5f5"/><path d="M38 15C43 20 52 25 58 12" stroke="#1e62d0" stroke-width="3" stroke-linecap="round"/></svg>
      <div class="flex -space-x-px mr-4">
        <button onclick="window.location.href='offerpageC.html'" class="px-8 py-2 font-bold border border-gray-300 rounded-t-md text-lg bg-white">Offer</button>
        <button onclick="window.location.href='bookmarkC.html'" class="px-8 py-2 font-bold border border-gray-300 rounded-t-md text-lg bg-white">Bookmark</button>
        <button onclick="window.location.href='massageC.html'" class="px-8 py-2 font-bold border border-gray-300 rounded-t-md text-lg bg-white">Message</button>
      </div>
      <button onclick="window.location.href='mypageC.html'" class="pr-2 text-sm text-blue-600 font-bold">My Page</button>
    </header>

    <!-- Search bar row 1: keyword + location + work mode -->
    <div class="grid grid-cols-12 gap-3 mb-3">
      <div class="col-span-4">
        <input type="text" id="kw" placeholder="Job Title, Keyword"
          class="w-full h-[42px] border border-gray-400 bg-[#b2dfdb] px-3 font-bold text-sm placeholder-black focus:outline-none">
      </div>
      <div class="col-span-3">
        <input type="text" id="loc" placeholder="Location e.g. Brisbane"
          class="w-full h-[42px] border border-gray-400 bg-[#b2dfdb] px-3 font-bold text-sm placeholder-black focus:outline-none">
      </div>
      <div class="col-span-3">
        <select id="wm" class="w-full h-[42px] border border-gray-400 bg-[#b2dfdb] px-3 font-bold text-sm focus:outline-none">
          <option value="">Work Mode</option>
          <option value="Remote">Remote</option>
          <option value="Hybrid">Hybrid</option>
          <option value="On-site">On-site</option>
        </select>
      </div>
      <div class="col-span-2">
        <button onclick="doSearch()" class="w-full h-[42px] bg-[#b2dfdb] border border-gray-400 font-bold text-sm hover:bg-[#99ceca] transition">Search</button>
      </div>
    </div>

    <!-- Search bar row 2: salary range filter -->
    <div class="flex items-center gap-3 mb-8">
      <span class="text-sm font-bold text-gray-600 whitespace-nowrap">Salary range ($):</span>
      <input type="number" id="sal-min" placeholder="Min e.g. 60000"
        class="w-[160px] h-[36px] border border-gray-300 bg-white px-3 text-sm focus:outline-none focus:border-blue-400">
      <span class="text-sm text-gray-500">to</span>
      <input type="number" id="sal-max" placeholder="Max e.g. 100000"
        class="w-[160px] h-[36px] border border-gray-300 bg-white px-3 text-sm focus:outline-none focus:border-blue-400">
      <button onclick="clearFilters()" class="text-xs text-gray-400 hover:text-red-500 underline">Clear filters</button>
    </div>

    <div id="job-list" class="space-y-6">
      <div class="text-gray-400 text-sm text-center py-8">Loading jobs...</div>
    </div>
  </div>

  <script>
    if (!requireLogin('candidate')) {}

    function clearFilters() {
      document.getElementById('kw').value = '';
      document.getElementById('loc').value = '';
      document.getElementById('wm').value = '';
      document.getElementById('sal-min').value = '';
      document.getElementById('sal-max').value = '';
      doSearch();
    }

    async function doSearch() {
      const kw     = document.getElementById('kw').value;
      const loc    = document.getElementById('loc').value;
      const wm     = document.getElementById('wm').value;
      const salMin = document.getElementById('sal-min').value;
      const salMax = document.getElementById('sal-max').value;
      const list   = document.getElementById('job-list');
      list.innerHTML = '<div class="text-gray-400 text-sm text-center py-8">Searching...</div>';

      const res = await searchJobs(kw, loc, wm, salMin, salMax);

      if (!res.jobs || res.jobs.length === 0) {
        list.innerHTML = '<div class="text-gray-400 text-sm text-center py-8">No jobs found. Try different keywords or broaden your filters.</div>';
        return;
      }

      list.innerHTML = res.jobs.map(job => `
        <div class="border border-blue-300 p-4 bg-white shadow-sm">
          <div class="flex justify-between items-start">
            <div class="flex-1 pr-4">
              <h2 class="text-[16px] font-bold">${job.job_title}</h2>
              <h3 class="text-[15px] font-bold text-gray-700 mb-2">${job.company_name || ''}</h3>
              <p class="text-sm text-gray-700 mb-1">${job.job_description || ''}</p>
              <p class="text-sm text-gray-500">📍 ${job.location || ''} &nbsp;|&nbsp; 💼 ${job.work_mode || ''} &nbsp;|&nbsp; 💰 ${job.salary || 'Not specified'}</p>
              <p class="text-sm text-gray-500 mt-1">Skills: ${job.required_skills || ''}</p>
              ${job.match_score ? `<p class="text-sm font-bold text-blue-600 mt-1">Match: ${job.match_score}%</p>` : ''}
              ${job.matched_keywords && job.matched_keywords.length ? `<p class="text-xs text-gray-400 mt-0.5">${job.matched_keywords.map(k => '#'+k).join(' ')}</p>` : ''}
            </div>
            <div class="flex flex-col gap-2">
              <button onclick="applyJob(${job.id}, this)" class="bg-[#b2dfdb] border border-gray-400 px-4 py-1 text-sm font-bold hover:bg-[#99ceca] transition">Apply</button>
              <button onclick="bookmarkJob(${job.id}, this)" class="border border-gray-400 px-4 py-1 text-sm font-bold hover:bg-gray-100 transition">Save</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function applyJob(jobId, btn) {
      btn.textContent = 'Applying...'; btn.disabled = true;
      const res = await applyToJob(jobId);
      if (res.error) { alert(res.error); btn.textContent = 'Apply'; btn.disabled = false; }
      else { btn.textContent = 'Applied ✓'; btn.classList.add('bg-green-200'); }
    }

    async function bookmarkJob(jobId, btn) {
      const res = await addBookmark(jobId);
      if (res.error) { alert(res.error); }
      else { btn.textContent = 'Saved ✓'; btn.classList.add('bg-yellow-100'); }
    }

    // enter key triggers search
    ['kw','loc'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', e => { if (e.key === 'Enter') doSearch(); });
    });

    doSearch();
  </script>
</body>
</html>
