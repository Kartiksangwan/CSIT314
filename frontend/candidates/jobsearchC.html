<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Search Wireframe Match</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen font-sans p-6 text-black selection:bg-transparent">

  <div class="max-w-[850px] mx-auto border border-gray-200 p-8 shadow-sm">
    
    <h1 class="text-3xl font-medium text-gray-400 mb-4 flex items-center gap-1">
       <span class="text-2xl"></span>
    </h1>

    <header class="border border-blue-200 p-3 mb-12 flex items-center justify-between">
      <div class="flex items-center">
        <svg width="120" height="45" viewBox="0 0 120 45" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 35C20 30 25 15 10 15C5 15 2 25 12 30C22 35 30 20 35 15" stroke="#1e62d0" stroke-width="4" stroke-linecap="round"/>
          <path d="M42 32C35 25 35 12 48 15C55 17 50 30 42 32Z" fill="#50a5f5"/>
          <path d="M38 15C43 20 52 25 58 12" stroke="#1e62d0" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="flex -space-x-px mr-4">
        <button class="px-8 py-2 font-bold border border-gray-400 rounded-t-md text-lg bg-white">Offer</button>
        <button class="px-8 py-2 font-bold border border-gray-400 rounded-t-md text-lg bg-white">Bookmark</button>
        <button class="px-8 py-2 font-bold border border-gray-400 rounded-t-md text-lg bg-white">Message</button>
      </div>

      <div class="pr-2">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>
    </header>

    <div class="grid grid-cols-12 gap-6 items-start mb-8">
      <div class="col-span-3 relative">
        <div class="w-full bg-[#b2dfdb] border border-gray-400 p-2 text-base font-bold flex justify-between items-center h-[42px]">
          <span>Job Title, Keyword</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
      </div>

      <div class="col-span-3 relative">
        <div class="w-full bg-[#b2dfdb] border border-gray-400 p-2 text-base font-bold flex justify-between items-center h-[42px]">
          <span>Location</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></circle><circle cx="12" cy="10" r="3"></circle></svg>
        </div>
      </div>

      <div class="col-span-4 relative z-10">
        <div class="w-full bg-[#b2dfdb] border border-gray-400 p-2 text-base font-bold h-[42px] flex items-center">
          <span>Work Mode</span>
        </div>
        <div class="absolute top-[41px] left-0 w-[112%] bg-white border border-blue-300 p-4 flex justify-between items-center shadow-sm">
          <label class="flex items-center space-x-1.5 font-bold text-base cursor-pointer">
            <input type="checkbox" checked class="w-4 h-4 border-2 border-black accent-black rounded-none">
            <span>Remote</span>
          </label>
          <label class="flex items-center space-x-1.5 font-bold text-base cursor-pointer">
            <input type="checkbox" class="w-4 h-4 border-2 border-black accent-black rounded-none">
            <span>On-site</span>
          </label>
          <label class="flex items-center space-x-1.5 font-bold text-base cursor-pointer">
            <input type="checkbox" class="w-4 h-4 border-2 border-black accent-black rounded-none">
            <span>Hybrid</span>
          </label>
        </div>
      </div>

      <div class="col-span-2">
        <div class="w-full bg-[#b2dfdb] border border-gray-400 h-[42px] flex items-center justify-center font-bold text-base cursor-pointer">
          Search
        </div>
      </div>
    </div>

    <div class="grid grid-cols-12 gap-8 pt-6">
      <div class="col-span-4 space-y-10">
        <div class="w-full h-40 bg-[#dddddd] border border-gray-500 relative">
          <svg class="absolute inset-0 w-full h-full stroke-gray-600 stroke-[1]" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
            <line x1="0" y1="0" x2="100%" y2="100%" />
            <line x1="100%" y1="0" x2="0" y2="100%" />
          </svg>
        </div>
        <div class="w-full h-40 bg-[#dddddd] border border-gray-500 relative">
          <svg class="absolute inset-0 w-full h-full stroke-gray-600 stroke-[1]" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
            <line x1="0" y1="0" x2="100%" y2="100%" />
            <line x1="100%" y1="0" x2="0" y2="100%" />
          </svg>
        </div>
      </div>

      <div class="col-span-8 flex flex-col justify-end">
        <div class="border border-blue-300 p-4 bg-white h-fit">
          <h2 class="text-lg font-bold text-black tracking-wide">Nexa Systems</h2>
          <h3 class="text-lg font-bold text-black mb-3 tracking-wide">Backend Engineer</h3>
          <ul class="list-disc pl-5 space-y-1 text-base font-bold text-black">
            <li>Develop and maintain server-side applications</li>
            <li>Work with SQL databases and APIs</li>
            <li>Participate in Agile team development</li>
          </ul>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
