<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../api.js"></script>
</head>
<body class="bg-white min-h-screen font-sans p-6 text-black">
  <div class="max-w-[850px] mx-auto border border-gray-200 p-8 shadow-sm">
    <h1 class="text-3xl font-medium text-gray-400 mb-4">My page (Bookmark) <span class="text-2xl">★</span></h1>
    <header class="border border-blue-200 p-3 mb-10 flex items-center justify-between">
      <svg width="120" height="45" viewBox="0 0 120 45" fill="none"><path d="M15 35C20 30 25 15 10 15C5 15 2 25 12 30C22 35 30 20 35 15" stroke="#1e62d0" stroke-width="4" stroke-linecap="round"/><path d="M42 32C35 25 35 12 48 15C55 17 50 30 42 32Z" fill="#50a5f5"/><path d="M38 15C43 20 52 25 58 12" stroke="#1e62d0" stroke-width="3" stroke-linecap="round"/></svg>
      <div class="flex -space-x-px mr-4">
        <button onclick="window.location.href='offerpageC.html'" class="px-8 py-2 font-bold border border-gray-300 rounded-t-md text-lg bg-white">Offer</button>
        <button class="px-8 py-2 font-bold border border-gray-400 rounded-t-md text-lg bg-gray-100 text-blue-600">Bookmark</button>
        <button onclick="window.location.href='massageC.html'" class="px-8 py-2 font-bold border border-gray-300 rounded-t-md text-lg bg-white">Message</button>
      </div>
      <button onclick="window.location.href='mypageC.html'" class="pr-2 text-sm text-blue-600 font-bold">My Page</button>
    </header>

    <h2 class="text-xl font-bold mb-6 pl-12">Bookmarks</h2>
    <div id="bookmark-grid" class="grid grid-cols-3 gap-6 max-w-[760px] mx-auto">
      <div class="col-span-3 text-gray-400 text-sm text-center py-8">Loading...</div>
    </div>
  </div>

  <script>
    async function loadBookmarks() {
      if (!requireLogin('candidate')) return;
      const res = await getBookmarks();
      const grid = document.getElementById('bookmark-grid');

      if (!res.bookmarks || res.bookmarks.length === 0) {
        grid.innerHTML = '<div class="col-span-3 text-gray-400 text-sm text-center py-8">No saved jobs yet. Search jobs and click Save!</div>';
        return;
      }

      grid.innerHTML = res.bookmarks.map(b => `
        <div class="border border-blue-300 bg-white p-4 flex flex-col items-center text-center min-h-[200px] justify-between">
          <div class="text-[13px] leading-tight text-black">
            <div class="font-bold text-[15px]">${b.job.company_name || 'Company'}</div>
            <div class="font-normal text-gray-900 mt-1">${b.job.job_title}</div>
            <div class="text-gray-700 mt-2 text-xs">${b.job.required_skills || ''}</div>
            <div class="text-gray-700 text-xs mt-1">📍 ${b.job.location || ''} &nbsp; 💼 ${b.job.work_mode || ''}</div>
          </div>
          <div class="mt-3 flex gap-2">
            <button onclick="applyJob(${b.job.id}, this)" class="bg-[#b2dfdb] border border-gray-400 px-3 py-1 text-xs font-bold hover:bg-[#99ceca]">Apply</button>
            <button onclick="removeBm(${b.job.id}, this)" class="border border-gray-400 px-3 py-1 text-xs font-bold hover:bg-red-50 text-red-500">Remove</button>
          </div>
        </div>
      `).join('');
    }

    async function applyJob(jobId, btn) {
      btn.textContent = '...'; btn.disabled = true;
      const res = await applyToJob(jobId);
      if (res.error) { alert(res.error); btn.textContent = 'Apply'; btn.disabled = false; }
      else { btn.textContent = '✓ Applied'; btn.classList.add('bg-green-200'); }
    }

    async function removeBm(jobId, btn) {
      const res = await removeBookmark(jobId);
      if (res.error) { alert(res.error); }
      else { loadBookmarks(); }
    }

    loadBookmarks();
  </script>
</body>
</html>
