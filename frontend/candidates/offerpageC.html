<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../api.js"></script>
</head>
<body class="bg-white min-h-screen font-sans p-6 text-black">
  <div class="max-w-[850px] mx-auto border border-gray-200 p-8 shadow-sm">
    <h1 class="text-3xl font-medium text-gray-400 mb-4">Offer <span class="text-2xl">★</span></h1>
    <header class="border border-blue-200 p-3 mb-10 flex items-center justify-between">
      <svg width="120" height="45" viewBox="0 0 120 45" fill="none"><path d="M15 35C20 30 25 15 10 15C5 15 2 25 12 30C22 35 30 20 35 15" stroke="#1e62d0" stroke-width="4" stroke-linecap="round"/><path d="M42 32C35 25 35 12 48 15C55 17 50 30 42 32Z" fill="#50a5f5"/><path d="M38 15C43 20 52 25 58 12" stroke="#1e62d0" stroke-width="3" stroke-linecap="round"/></svg>
      <div class="flex -space-x-px mr-4">
        <button class="px-8 py-2 font-bold border border-gray-400 rounded-t-md text-lg bg-gray-100 text-blue-600">Offer</button>
        <button onclick="window.location.href='bookmarkC.html'" class="px-8 py-2 font-bold border border-gray-300 rounded-t-md text-lg bg-white">Bookmark</button>
        <button onclick="window.location.href='massageC.html'" class="px-8 py-2 font-bold border border-gray-300 rounded-t-md text-lg bg-white">Message</button>
      </div>
      <button onclick="window.location.href='mypageC.html'" class="pr-2 text-sm text-blue-600 font-bold">My Page</button>
    </header>

    <h2 class="text-xl font-bold mb-8 pl-16">Offers</h2>
    <div id="offer-list" class="space-y-10 max-w-[720px] mx-auto">
      <div class="text-gray-400 text-sm text-center py-8">Loading...</div>
    </div>
  </div>

  <script>
    async function loadOffers() {
      if (!requireLogin('candidate')) return;
      const res = await getOffers();
      const list = document.getElementById('offer-list');

      if (!res.offers || res.offers.length === 0) {
        list.innerHTML = '<div class="text-gray-400 text-sm text-center py-8">No offers yet.</div>';
        return;
      }

      list.innerHTML = res.offers.map(o => `
        <div class="grid grid-cols-12 gap-6 items-center border-b border-gray-200 pb-8">
          <div class="col-span-8">
            <div class="border border-blue-300 p-4 bg-white min-h-[140px]">
              <h3 class="text-[15px] font-bold">${o.company_name || 'Company'}</h3>
              <h4 class="text-[15px] font-normal text-gray-900 mt-1">${o.job_title || ''}</h4>
              <p class="text-[14px] text-gray-800 mt-3">${o.message || ''}</p>
              ${o.interview_date ? `<p class="text-sm font-bold text-blue-700 mt-2">📅 ${o.interview_date} at ${o.interview_time || ''}</p>` : ''}
              <div class="mt-2">
                <span class="inline-block px-2 py-0.5 text-xs font-bold rounded ${o.status === 'accepted' ? 'bg-green-100 text-green-700' : o.status === 'rejected' ? 'bg-red-100 text-red-600' : 'bg-yellow-100 text-yellow-700'}">
                  ${o.status.toUpperCase()}
                </span>
              </div>
            </div>
          </div>
          <div class="col-span-4 flex flex-col gap-3">
            ${o.status === 'pending' ? `
              <button onclick="respond(${o.id}, 'accepted', this)" class="bg-[#b2dfdb] border border-gray-400 px-4 py-2 font-bold text-sm hover:bg-[#99ceca]">Accept</button>
              <button onclick="respond(${o.id}, 'rejected', this)" class="bg-red-100 border border-gray-400 px-4 py-2 font-bold text-sm hover:bg-red-200">Reject</button>
            ` : `<span class="text-sm text-gray-500">Response sent</span>`}
          </div>
        </div>
      `).join('');
    }

    async function respond(offerId, status, btn) {
      btn.disabled = true; btn.textContent = '...';
      const res = await respondToOffer(offerId, status);
      if (res.error) { alert(res.error); btn.disabled = false; }
      else { loadOffers(); }
    }

    loadOffers();
  </script>
</body>
</html>
